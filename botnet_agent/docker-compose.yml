services:
  bot_student:
    build: .
    environment:
      - BOT_TYPE=student
      - TARGET_URL=https://10.10.100.4
    networks:
      - gns3_bridge

  bot_professor:
    build: .
    environment:
      - BOT_TYPE=professor
      - TARGET_URL=https://10.10.100.4
    networks:
      - gns3_bridge

  bot_ddos:
    build: .
    environment:
      - BOT_TYPE=ddos
      - TARGET_URL=https://10.10.100.4
    networks:
      - gns3_bridge

networks:
  gns3_bridge:
    driver: macvlan
    driver_opts:
      parent: bond0
    ipam:
      config:
        - subnet: 10.10.250.0/29
          gateway: 10.10.250.1
              
