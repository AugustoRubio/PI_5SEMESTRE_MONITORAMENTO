server {
    listen 80;
    server_name _;

    # Redireciona todo o tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Configuração dos certificados SSL - Caminho padrão para Ubuntu
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Configurações de segurança SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Otimização de TLS para evitar timeout no primeiro acesso
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # Reduz o tamanho do buffer TLS para evitar fragmentação de pacotes (Timeout/Handshake preso no GNS3)
    ssl_buffer_size 1360;

    # Configurações para otimizar o proxy reverso da Intranet
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mantém ativo o phpMyAdmin (PHP 8.3) adaptado da configuração antiga
    location ^~ /phpmyadmin/ {
        root /usr/share/;
        index index.php index.html index.htm;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
        }

        location ~* ^/phpmyadmin/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$ {
            root /usr/share/;
        }
    }

    # Bloqueia acessos indesejados ao git ou env
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Ignora logs desnecessários para arquivo não encontrado (comum logo no IP)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Página de erro customizada (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}