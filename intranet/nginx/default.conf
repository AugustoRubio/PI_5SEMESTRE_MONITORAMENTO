server {
    listen 80;
    server_name _;

    # Redireciona todo o tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Configuração dos certificados SSL
    ssl_certificate /etc/pki/tls/certs/INTRANET.crt;
    ssl_certificate_key /etc/pki/tls/private/INTRANET.key;

    # Configurações de segurança SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Configurações para otimizar o proxy reverso da Intranet
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueia acessos indesejados ao git ou env
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Ignora logs desnecessários para arquivo não encontrado (comum logo no IP)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Inclui as configurações padrão do AlmaLinux 
    include /etc/nginx/default.d/*.conf;

    # Página de erro customizada (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}