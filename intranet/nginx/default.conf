server {
    listen 80;
    server_name _;

    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location / {
        # Redireciona todo o trafego HTTP para HTTPS
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Configuracao dos certificados SSL
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Configuracoes de seguranca SSL recomendadas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Otimizacao de TLS para evitar timeout no primeiro acesso
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Reduz o tamanho do buffer TLS para evitar fragmentacao de pacotes
    ssl_buffer_size 1360;

    # Configuracoes para otimizar o proxy reverso da Intranet
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para o Microsservico de Pagamentos (SOA) rodando em Docker
    location /api/billing/ {
        rewrite ^/api/billing/(.*) /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mantem ativo o phpMyAdmin (PHP 8.3) adaptado da configuracao antiga
    location ^~ /phpmyadmin/ {
        root /usr/share/;
        index index.php index.html index.htm;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
        }

        location ~* ^/phpmyadmin/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$ {
            root /usr/share/;
        }
    }

    # Bloqueia acessos indesejados ao git ou env
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Ignora logs desnecessarios para arquivo nao encontrado
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Pagina de erro customizada
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
