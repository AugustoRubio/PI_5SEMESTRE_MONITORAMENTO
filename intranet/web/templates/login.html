<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intranet Faculdade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4 text-primary">Intranet Faculdade</h3>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.write('<div class="alert alert-danger">Usuário ou senha incorretos!</div>');
        }
    </script>

    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label">Usuário (Professor)</label>
            <input type="text" name="username" class="form-control" required placeholder="Ex: professor">
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control" required placeholder="Ex: senha123">
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar no Sistema</button>
    </form>
</div>

</body>
</html>
