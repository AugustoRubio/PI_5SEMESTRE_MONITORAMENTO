<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chamada - {{ cls.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .falta-check:checked {
            background-color: #dc3545;
            border-color: #dc3545;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark mb-4 shadow-sm" style="background-color: #1e3c5a;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/prof_dashboard">
            <i class="fas fa-arrow-left me-3"></i> Diário de Classe: {{ cls.name }}
        </a>
        <a href="/logout" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt"></i> Sair</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 border-bottom-0">
            <form method="GET" action="/prof_dashboard/class/{{ cls.id }}" class="d-flex align-items-center justify-content-center">
                <label class="me-3 fw-bold text-primary mb-0" style="font-size: 1.1rem;"><i class="fas fa-calendar-alt me-2"></i>Data da Chamada:</label>
                <input type="date" name="date" class="form-control w-25 me-3" value="{{ today }}">
                <button type="submit" class="btn btn-outline-primary shadow-sm">Carregar Relatório Deste Dia</button>
            </form>
        </div>
        <div class="card-body p-0">
            <form method="POST" action="/prof_dashboard/class/{{ cls.id }}/attendance">
                <input type="hidden" name="date" value="{{ today }}">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">RA (Registro Acadêmico)</th>
                            <th>Nome do Aluno</th>
                            <th class="text-center" style="width: 200px;">Lançamento de Falta</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for st in cls.students %}
                        <tr>
                            <td class="ps-4 font-monospace">{{ st.registration }}</td>
                            <td class="fw-bold text-secondary">{{ st.name }}</td>
                            <td class="text-center bg-white">
                                <div class="form-check form-switch d-flex justify-content-center mb-0">
                                    <input class="form-check-input falta-check fs-4 m-0 shadow-sm" type="checkbox" name="absent_students" value="{{ st.id }}" id="absent_{{ st.id }}" {% if st.id in absent_student_ids %}checked{% endif %}>
                                </div>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center py-4 text-muted">Nenhum aluno matriculado nesta turma.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                <div class="p-4 bg-light text-end border-top d-flex justify-content-between align-items-center">
                    <span class="text-danger fw-bold"><i class="fas fa-exclamation-triangle me-1"></i>Atenção: Apenas marque os alunos AUSENTES.</span>
                    <button type="submit" class="btn btn-success px-5 py-2 shadow"><i class="fas fa-save me-2"></i>Salvar Diário de Classe</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
