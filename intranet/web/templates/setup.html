<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Intranet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .setup-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>

<div class="setup-container">
    <h2 class="text-center mb-4">⚙️ Configuração Inicial</h2>
    <p class="text-muted text-center">O sistema não conseguiu conectar ao banco de dados. Por favor, insira as credenciais do MariaDB para configurar a Intranet.</p>
    
    {% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form action="/setup" method="POST">
        <div class="mb-3">
            <label class="form-label">Host do Banco de Dados</label>
            <input type="text" class="form-control" name="db_host" value="{{ form_data.db_host if form_data else '127.0.0.1' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Porta</label>
            <input type="text" class="form-control" name="db_port" value="{{ form_data.db_port if form_data else '3306' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nome do Banco</label>
            <input type="text" class="form-control" name="db_name" value="{{ form_data.db_name if form_data else 'intranet_db' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" class="form-control" name="db_user" value="{{ form_data.db_user if form_data else 'intranet_user' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" name="db_pass" value="{{ form_data.db_pass if form_data else '' }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Testar Conexão e Salvar</button>
    </form>
</div>

</body>
</html>
