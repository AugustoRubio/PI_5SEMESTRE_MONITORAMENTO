services:
  snmpsim:
    image: tandrup/snmpsim
    container_name: snmpsim_pi
    ports:
      - "10161:161/udp"
    volumes:
      - ./data:/usr/snmpsim/data
    restart: unless-stopped
    networks:
      - sim_snmp_net
    command:
      - "snmpsimd.py"
      - "--agent-udpv4-endpoint=0.0.0.0:161"
      - "--process-user=snmpsim"
      - "--process-group=nogroup"
      - "--data-dir=/usr/snmpsim/data"

  bruteforce:
    build: ../bruteforce_simulator
    container_name: bruteforce_pi
    networks:
      - sim_snmp_net
    volumes:
      # A MÁGICA ACONTECE AQUI: O Python salvará o arquivo na mesma pasta ./data do host
      - ./data:/data
    environment:
      # Passamos o caminho exato para o script em Python saber onde salvar
      - SNMPREC_PATH=/data/security_monitor.snmprec
      - TARGET_URL=https://10.10.100.4/login
      - CONCURRENCY=10
    # A linha 'command: ["tail"...]' foi removida para o CMD do Dockerfile assumir o controle
    restart: unless-stopped

networks:
  sim_snmp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.101.0/24