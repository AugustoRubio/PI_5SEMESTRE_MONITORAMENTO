<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - PI 5º Semestre</title>
    <!-- Bootstrap CSS para um visual rápido e profissional -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 20px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Painel de Simulação - PI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/"><i class="bi bi-house-door"></i> Dashboard</a>
                </li>
                
                <!-- Menu Dropdown: Simulações -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="simulacoesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-controller"></i> Simulações
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="simulacoesDropdown">
                        <li><a class="dropdown-item" href="/devices"><i class="bi bi-router"></i> Dispositivos SNMP</a></li>
                        <li><a class="dropdown-item text-danger" href="/attacks"><i class="bi bi-crosshair"></i> Ataques (Red Team)</a></li>
                        <li><a class="dropdown-item text-warning" href="/stress"><i class="bi bi-activity"></i> Testes de Estresse</a></li>
                        <li><a class="dropdown-item text-primary" href="/simulation"><i class="bi bi-robot"></i> Simulação de Uso DB</a></li>
                    </ul>
                </li>

                <!-- Menu Dropdown: Sistema -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="sistemaDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-gear"></i> Sistema
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="sistemaDropdown">
                        <li><a class="dropdown-item text-warning" href="/config"><i class="bi bi-sliders"></i> Configurações</a></li>
                        <li><a class="dropdown-item text-info" href="/admin"><i class="bi bi-people"></i> Usuários</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/docs" target="_blank"><i class="bi bi-file-earmark-code"></i> API Docs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-secondary" href="#" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Sair</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script base para chamadas de API -->
<script>
    // Verifica se o usuário está logado
    const token = localStorage.getItem('token');
    if (!token && window.location.pathname !== '/login') {
        window.location.href = '/login';
    }

    // Função para verificar a validade do token com o backend
    async function checkAuth() {
        if (window.location.pathname === '/login') return;
        
        try {
            const response = await fetch('/api/auth/verify', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
            
            if (!response.ok) {
                console.log("Sessão inválida ou expirada. Redirecionando para login.");
                logout();
            }
        } catch (error) {
            console.error("Erro ao verificar autenticação:", error);
        }
    }

    // Verifica a autenticação assim que a página carrega
    document.addEventListener('DOMContentLoaded', checkAuth);

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    async function callApi(endpoint, method = 'POST') {
        try {
            const response = await fetch(endpoint, { 
                method: method,
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            });
            
            if (response.status === 401) {
                alert('Sessão expirada. Faça login novamente.');
                logout();
                return;
            }

            const data = await response.json();
            alert(data.message || data.detail || 'Ação executada.');
        } catch (error) {
            alert('Erro ao executar a ação: ' + error);
        }
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
