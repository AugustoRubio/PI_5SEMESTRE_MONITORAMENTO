zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 56d3df1bce5f4c6980346343bc8dd860
      name: 'Templates/Power'
  templates:
    - uuid: cf18183a8ef74f64af147c8128f0b992
      template: 'Template APC Simulado SNMP'
      name: 'Template APC Simulado SNMP'
      description: 'Template criado sob medida para monitorar o Nobreak APC Simulado, sem erros de "No Such Instance".'
      groups:
        - name: 'Templates/Power'
      items:
        - uuid: c3a8020e34804cd9b9ac19eb736eb6a9
          name: 'Nobreak: Status da Bateria'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.2.1.1.0'
          key: upsBasicBatteryStatus
          delay: 30s
          history: 7d
          value_type: UNSIGNED
          description: 'Status atual da bateria (2=normal, 3=onBattery)'
          valuemap:
            name: 'APC Battery Status'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 131e57bf60cf4ffb8a56661627bf03cf
              expression: 'last(/Template APC Simulado SNMP/upsBasicBatteryStatus)=3'
              name: 'Nobreak: Operando na Bateria'
              priority: HIGH
              description: 'O nobreak perdeu energia da rede e está operando na bateria.'

        - uuid: 8112d93285fb4ddc99bf3143b9d059ef
          name: 'Nobreak: Capacidade da Bateria (%)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.2.2.1.0'
          key: upsAdvBatteryCapacity
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Capacidade restante da bateria em porcentagem.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: db3be45a980f4aa69da6782723e51827
              expression: 'last(/Template APC Simulado SNMP/upsAdvBatteryCapacity)<20'
              name: 'Nobreak: Capacidade da bateria muito baixa (< 20%)'
              priority: HIGH

        - uuid: e9e366206d404481ac80896143ed721d
          name: 'Nobreak: Tempo Restante de Bateria (Ticks)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.2.2.3.0'
          key: upsAdvBatteryRunTimeRemaining
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Tempo restante de funcionamento na bateria (em ticks).'
          tags:
            - tag: Application
              value: Power

        - uuid: 27a6f39b960846518660399ad165a394
          name: 'Nobreak: Voltagem de Entrada (V)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.3.3.1.0'
          key: upsAdvInputVoltage
          delay: 30s
          history: 7d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão de entrada atual (Volts).'
          tags:
            - tag: Application
              value: Power

        - uuid: 10b19b9bbd8d42628a03578931e32521
          name: 'Nobreak: Voltagem de Saída (V)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.4.1.1.0'
          key: upsAdvOutputVoltage
          delay: 30s
          history: 7d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão de saída atual (Volts).'
          tags:
            - tag: Application
              value: Power

        - uuid: c802b192ad3d4cfc83e3ad94d6c08d03
          name: 'Nobreak: Carga de Saída (%)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.4.3.3.0'
          key: upsAdvOutputLoad
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Porcentagem de carga atual suportada pelo nobreak.'
          tags:
            - tag: Application
              value: Power

        - uuid: 37a890173bc741fea46a2a940d805c84
          name: 'Nobreak: Corrente de Saída (A)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.4.3.4.0'
          key: upsAdvOutputCurrent
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: 'A'
          description: 'Corrente de saída (Amperes).'
          tags:
            - tag: Application
              value: Power

      valuemaps:
        - uuid: 136d0d79d69a43149770acf61439ea08
          name: 'APC Battery Status'
          mappings:
            - value: '1'
              newvalue: Unknown
            - value: '2'
              newvalue: Normal
            - value: '3'
              newvalue: On Battery
