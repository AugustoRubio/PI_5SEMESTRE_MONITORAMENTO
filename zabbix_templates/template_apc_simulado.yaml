zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 56d3df1bce5f4c6980346343bc8dd860
      name: 'Templates/Power'
  templates:
    - uuid: cf18183a8ef74f64af147c8128f0b992
      template: 'Template APC Simulado SNMP'
      name: 'Template APC Simulado SNMP'
      description: 'Template criado sob medida para monitorar o Nobreak APC Simulado, sem erros de "No Such Instance".'
      groups:
        - name: 'Templates/Power'
      items:
        - uuid: c3a8020e34804cd9b9ac19eb736eb6a9
          name: 'Nobreak: Status da Bateria'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.2.1.1.0'
          key: upsBasicBatteryStatus
          delay: 30s
          history: 7d
          value_type: UNSIGNED
          description: 'Status atual da bateria (2=normal, 3=onBattery)'
          valuemap:
            name: 'APC Battery Status'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: 131e57bf60cf4ffb8a56661627bf03cf
              expression: 'last(/Template APC Simulado SNMP/upsBasicBatteryStatus)=3'
              name: 'Nobreak: Operando na Bateria'
              priority: HIGH
              description: 'O nobreak perdeu energia da rede e está operando na bateria.'

        - uuid: 8112d93285fb4ddc99bf3143b9d059ef
          name: 'Nobreak: Capacidade da Bateria (%)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.2.2.1.0'
          key: upsAdvBatteryCapacity
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Capacidade restante da bateria em porcentagem.'
          tags:
            - tag: Application
              value: Power
          triggers:
            - uuid: db3be45a980f4aa69da6782723e51827
              expression: 'last(/Template APC Simulado SNMP/upsAdvBatteryCapacity)<20'
              name: 'Nobreak: Capacidade da bateria muito baixa (< 20%)'
              priority: HIGH

        - uuid: e9e366206d404481ac80896143ed721d
          name: 'Nobreak: Tempo Restante de Bateria (Ticks)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.2.2.3.0'
          key: upsAdvBatteryRunTimeRemaining
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Tempo restante de funcionamento na bateria (em ticks).'
          tags:
            - tag: Application
              value: Power

        - uuid: 27a6f39b960846518660399ad165a394
          name: 'Nobreak: Voltagem de Entrada (V)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.3.3.1.0'
          key: upsAdvInputVoltage
          delay: 30s
          history: 7d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão de entrada atual (Volts).'
          tags:
            - tag: Application
              value: Power

        - uuid: 10b19b9bbd8d42628a03578931e32521
          name: 'Nobreak: Voltagem de Saída (V)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.4.1.1.0'
          key: upsAdvOutputVoltage
          delay: 30s
          history: 7d
          value_type: FLOAT
          units: 'V'
          description: 'Tensão de saída atual (Volts).'
          tags:
            - tag: Application
              value: Power

        - uuid: c802b192ad3d4cfc83e3ad94d6c08d03
          name: 'Nobreak: Carga de Saída (%)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.4.3.3.0'
          key: upsAdvOutputLoad
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Porcentagem de carga atual suportada pelo nobreak.'
          tags:
            - tag: Application
              value: Power

        - uuid: 37a890173bc741fea46a2a940d805c84
          name: 'Nobreak: Corrente de Saída (A)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.1.4.3.4.0'
          key: upsAdvOutputCurrent
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: 'A'
          description: 'Corrente de saída (Amperes).'
          tags:
            - tag: Application
              value: Power
        - uuid: db3b3cd727534b3b8c67e39db7e1e78a
          name: 'Nobreak: Tempo de Atividade (Uptime)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.3.0'
          key: sysUpTime
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          units: uptime
          description: 'Tempo desde a última reinicialização do serviço SNMP.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: ecc73af29b964b1e8b0ce01b7583e4ff
              expression: 'last(/Template APC Simulado SNMP/sysUpTime)<10m'
              name: 'Nobreak: Foi reiniciado recentemente (uptime < 10m)'
              priority: INFO

        - uuid: 2fe9336a332b4fbd959bcf11f45a8749
          name: 'Nobreak: Status do Agente SNMP'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Disponibilidade do agente SNMP (1 = disponível, 0 = indisponível).'
          valuemap:
            name: 'SNMP Availability'
          tags:
            - tag: Application
              value: Status
          triggers:
            - uuid: 57c1d0bbc1b3415e9c98a9b8d859e066
              expression: 'max(/Template APC Simulado SNMP/zabbix[host,snmp,available],3m)=0'
              name: 'Nobreak: Agente SNMP Inalcançável'
              priority: HIGH
        - uuid: 2ed6e1f28ca24ca39ace0c64246cfcab
          name: 'Nobreak (Probe): Temperatura'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.25.1.2.1.3.1.1'
          key: upsEnvTemperature
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '°C'
          description: 'Temperatura lida pelo sensor ambiental do Nobreak.'
          tags:
            - tag: Application
              value: Environment
          triggers:
            - uuid: d28906649f34426bbe2102058a26ec0c
              expression: 'last(/Template APC Simulado SNMP/upsEnvTemperature)>=30'
              name: 'Nobreak (Probe): Temperatura Crítica (>= 30°C)'
              priority: HIGH

        - uuid: 8324b8b7c1d846ae9ce25fee8054683e
          name: 'Nobreak (Probe): Umidade Relativa'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.318.1.1.25.1.2.2.3.1.1'
          key: upsEnvHumidity
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
          description: 'Umidade relativa lida pelo sensor ambiental do Nobreak.'
          tags:
            - tag: Application
              value: Environment
          triggers:
            - uuid: 471578937764419b873842af19bcc5a4
              expression: 'last(/Template APC Simulado SNMP/upsEnvHumidity)>=80'
              name: 'Nobreak (Probe): Umidade Muito Alta (>= 80%)'
              priority: WARNING
            - uuid: 6bd6ffe6c62041ec8ab442ab8057c078
              expression: 'last(/Template APC Simulado SNMP/upsEnvHumidity)<=20'
              name: 'Nobreak (Probe): Umidade Muito Baixa (<= 20%)'
              priority: WARNING




      valuemaps:
        - uuid: 136d0d79d69a43149770acf61439ea08
          name: 'APC Battery Status'
          mappings:
            - value: '1'
              newvalue: Unknown
            - value: '2'
              newvalue: Normal
            - value: '3'
              newvalue: On Battery
        - uuid: 58fc850100e0464a96ccfb6f515fd568
          name: 'SNMP Availability'
          mappings:
            - value: '0'
              newvalue: Inativo
            - value: '1'
              newvalue: Disponível
            - value: '2'
              newvalue: Desconhecido

  graphs:
    - uuid: 5e1276bedbe84ac8b3c22cc27c5d0ed6
      name: 'Nobreak: Voltagens de Entrada e Saída'
      graph_items:
        - color: 1A7C11
          item:
            host: 'Template APC Simulado SNMP'
            key: upsAdvInputVoltage
        - sortorder: '1'
          color: 2774A4
          item:
            host: 'Template APC Simulado SNMP'
            key: upsAdvOutputVoltage
    - uuid: d390a2afe6af408ba0ec1763a2dee679
      name: 'Nobreak: Capacidade e Carga'
      graph_items:
        - color: F63100
          item:
            host: 'Template APC Simulado SNMP'
            key: upsAdvBatteryCapacity
        - sortorder: '1'
          color: A54F10
          item:
            host: 'Template APC Simulado SNMP'
            key: upsAdvOutputLoad

    - uuid: 7f4746b82c7142e9997784cb5a1199ce
      name: 'Nobreak: Temperatura e Umidade (Ambiente)'
      graph_items:
        - color: FF4500
          item:
            host: 'Template APC Simulado SNMP'
            key: upsEnvTemperature
        - sortorder: '1'
          color: 00BFFF
          item:
            host: 'Template APC Simulado SNMP'
            key: upsEnvHumidity
