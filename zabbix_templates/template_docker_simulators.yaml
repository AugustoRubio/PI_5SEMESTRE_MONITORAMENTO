zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: d9a9b2b512c544c9b132890d235c5d21
      name: 'Templates/Docker'
  templates:
    - uuid: e8a9b2b512c544c9b132890d235c5d22
      template: 'Template Simuladores Docker - API'
      name: 'Template Simuladores Docker - API'
      description: 'Monitora o consumo de CPU e Memória de todos os containers Docker da infraestrutura usando a API do Painel Web.'
      groups:
        - name: 'Templates/Docker'
      macros:
        - macro: '{$API_PORT}'
          value: '8443'
          description: 'Porta do Painel Web FastAPI'
      items:
        - uuid: f7a9b2b512c544c9b132890d235c5d23
          name: 'Docker: Stats Raw Data'
          type: HTTP_AGENT
          key: docker.stats.raw
          url: 'https://{HOST.CONN}:{$API_PORT}/api/docker/stats/public'
          delay: 30s
          history: '0'
          value_type: TEXT
          description: 'Coleta o JSON bruto com o status de todos os containers ativos.'
          tags:
            - tag: Application
              value: Docker
      discovery_rules:
        - uuid: c6a9b2b512c544c9b132890d235c5d24
          name: 'Descoberta de Containers Docker'
          type: DEPENDENT
          key: docker.containers.discovery
          delay: '0'
          lifetime: 1h
          master_item:
            key: docker.stats.raw
          lld_macro_paths:
            - lld_macro: '{#CONTAINER}'
              path: $.name
          item_prototypes:
            - uuid: b5a9b2b512c544c9b132890d235c5d25
              name: 'Container {#CONTAINER}: Uso de CPU (%)'
              type: DEPENDENT
              key: 'docker.cpu[{#CONTAINER}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name == "{#CONTAINER}")].cpu.first()'
              master_item:
                key: docker.stats.raw
              tags:
                - tag: Application
                  value: Docker
                - tag: Container
                  value: '{#CONTAINER}'
              trigger_prototypes:
                - uuid: a4a9b2b512c544c9b132890d235c5d26
                  expression: 'min(/Template Simuladores Docker - API/docker.cpu[{#CONTAINER}],5m)>85'
                  name: 'Container {#CONTAINER}: CPU muito Alta (> 85%)'
                  priority: WARNING
                  description: 'O container está consumindo muitos recursos do servidor e pode causar lentidão na simulação.'
            - uuid: 93a9b2b512c544c9b132890d235c5d27
              name: 'Container {#CONTAINER}: Uso de Memória (%)'
              type: DEPENDENT
              key: 'docker.mem[{#CONTAINER}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name == "{#CONTAINER}")].mem.first()'
              master_item:
                key: docker.stats.raw
              tags:
                - tag: Application
                  value: Docker
                - tag: Container
                  value: '{#CONTAINER}'
              trigger_prototypes:
                - uuid: 82a9b2b512c544c9b132890d235c5d28
                  expression: 'min(/Template Simuladores Docker - API/docker.mem[{#CONTAINER}],5m)>90'
                  name: 'Container {#CONTAINER}: Uso de Memória Crítico (> 90%)'
                  priority: HIGH