zabbix_export:
  version: '7.0'
  templates:
    - uuid: b542a229c15542158309a68a5717ce24
      template: 'Template Custom Nginx and HTTP Codes'
      name: 'Template Custom Nginx and HTTP Codes'
      description: 'Template 100% customizado para ler o stub_status do Nginx e os códigos de resposta HTTP (200, 300, 400, 500) gerados pela Intranet.'
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$INTRANET.HOST_HEADER}'
          value: '10.10.100.4'
          description: 'Cabeçalho Host enviado ao Proxy (O IP interno ou Domínio da Intranet).'
        - macro: '{$INTRANET.IP}'
          value: '10.255.255.2'
          description: 'O IP do servidor ou do Proxy/Túnel GRE (onde o Zabbix vai conectar fisicamente).'
        - macro: '{$INTRANET.PORT}'
          value: '80'
          description: 'Porta do servidor (ex: 443 para HTTPS ou 80 para HTTP).'
        - macro: '{$INTRANET.SCHEME}'
          value: 'http'
          description: 'http ou https'
      items:
        - uuid: a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
          name: 'Nginx: Obter RAW Stub Status'
          type: HTTP_AGENT
          key: nginx.raw.status
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/basic_status'
          value_type: TEXT
          delay: 30s
          description: 'Coleta bruta do /basic_status do Nginx.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a2
          name: 'Nginx: Conexões Ativas'
          type: DEPENDENT
          key: nginx.active_connections
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'Active connections:\s+([0-9]+)'
                - \1
        - uuid: 8c25dbda0f0449a6a8b13d6a4c281e09
          name: 'Nginx: Total de Requisições Aceitas'
          type: DEPENDENT
          key: nginx.accepted
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s*\n\s+([0-9]+)'
                - \1
        - uuid: f1a3b5c7d9e142a38b4c5d6e7f8a9b0c
          name: 'Nginx: Total de Requisições Processadas'
          type: DEPENDENT
          key: nginx.requests
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s*\n\s+[0-9]+\s+[0-9]+\s+([0-9]+)'
                - \1
                
        - uuid: a1b2c3d4e5f647a89b0c1d2e3f4a5b6c
          name: 'Intranet: Obter RAW HTTP Metrics'
          type: HTTP_AGENT
          key: intranet.http.raw
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/business/metrics'
          value_type: TEXT
          delay: 30s
          description: 'Coleta os códigos HTTP diretamente do backend FastAPI.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: c6b5a4f3e2d140b98a7b6c5d4e3f2a1b
          name: 'Intranet HTTP 200s (Sucesso)'
          type: DEPENDENT
          key: http.2xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_2xx'
        - uuid: 1a2b3c4d5e6f47a89b0c1d2e3f4a5b6c
          name: 'Intranet HTTP 300s (Redirecionamentos)'
          type: DEPENDENT
          key: http.3xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_3xx'
        - uuid: 6c5b4a3f2e1d40c98b7a6c5d4e3f2a1b
          name: 'Intranet HTTP 400s (Erros de Cliente)'
          type: DEPENDENT
          key: http.4xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_4xx'
        - uuid: d4e5f6a7b8c940d1a2b3c4d5e6f7a8b9
          name: 'Intranet HTTP 500s (Erros de Servidor)'
          type: DEPENDENT
          key: http.5xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_5xx'