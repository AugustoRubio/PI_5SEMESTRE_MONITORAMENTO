zabbix_export:
  version: '7.0'
  templates:
    - uuid: f3e5c9b2a7d148468b12e3a4c5d6f7a8
      template: 'Template Custom Nginx and HTTP Codes'
      name: 'Template Custom Nginx and HTTP Codes'
      description: 'Template 100% customizado para ler o stub_status do Nginx e os códigos de resposta HTTP (200, 300, 400, 500) gerados pela Intranet.'
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$INTRANET.HOST_HEADER}'
          value: '10.10.100.4'
          description: 'Obrigatório para o Proxy saber para qual servidor interno rotear (ex: 10.10.100.4 ou 10.10.101.4)'
        - macro: '{$INTRANET.IP}'
          value: '10.255.255.2'
          description: 'O IP alvo do monitoramento.'
        - macro: '{$INTRANET.PORT}'
          value: '80'
          description: 'Porta do servidor (ex: 443 para HTTPS ou 80 para HTTP).'
        - macro: '{$INTRANET.SCHEME}'
          value: 'http'
          description: 'http ou https'
      items:
        - uuid: b7d2f1a3c5e840159a6c4b2d1f3e5a7b
          name: 'Nginx: Obter RAW Stub Status'
          type: HTTP_AGENT
          key: nginx.raw.status
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/basic_status'
          value_type: TEXT
          delay: 30s
          description: 'Coleta bruta do /basic_status do Nginx.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: c1a2b3c4d5e64f788a9b0c1d2e3f4a5b
          name: 'Nginx: Conexões Ativas'
          type: DEPENDENT
          key: nginx.active_connections
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'Active connections:\s+([0-9]+)'
                - \1
        - uuid: e5d4c3b2a1f04987ba12c3d4e5f6a7b8
          name: 'Nginx: Total de Requisições Aceitas'
          type: DEPENDENT
          key: nginx.accepted
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s*\n\s+([0-9]+)'
                - \1
        - uuid: a8b7c6d5e4f342108c3a1b2d4e5f6a7b
          name: 'Nginx: Total de Requisições Processadas'
          type: DEPENDENT
          key: nginx.requests
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s*\n\s+[0-9]+\s+[0-9]+\s+([0-9]+)'
                - \1
                
        - uuid: d1e2f3a4b5c641899d2e3f4a5b6c7d8e
          name: 'Intranet: Obter RAW HTTP Metrics'
          type: HTTP_AGENT
          key: intranet.http.raw
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/http/metrics'
          value_type: TEXT
          delay: 30s
          description: 'Coleta os códigos HTTP diretamente do backend FastAPI.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: 1a2b3c4d5e6f47018a9b0c1d2e3f4a5b
          name: 'Intranet HTTP 200s (Sucesso)'
          type: DEPENDENT
          key: http.2xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_2xx'
        - uuid: 2f3e4d5c6b7a4812b1a2b3c4d5e6f7a8
          name: 'Intranet HTTP 300s (Redirecionamentos)'
          type: DEPENDENT
          key: http.3xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_3xx'
        - uuid: 3c4d5e6f7a8b49239c1d2e3f4a5b6c7d
          name: 'Intranet HTTP 400s (Erros de Cliente)'
          type: DEPENDENT
          key: http.4xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_4xx'
        - uuid: 4e5f6a7b8c9d4034aa1b2c3d4e5f6a7b
          name: 'Intranet HTTP 500s (Erros de Servidor)'
          type: DEPENDENT
          key: http.5xx
          value_type: FLOAT
          master_item:
            key: intranet.http.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_5xx'