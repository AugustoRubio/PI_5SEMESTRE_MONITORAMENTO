zabbix_export:
  version: '7.0'
  template_groups:
    - name: Templates/Applications
  templates:
    - uuid: b542a229c15542158309a68a5717ce24
      template: 'Template Intranet Completo'
      name: 'Template Intranet Completo (Nginx, HTTP, Business)'
      description: 'Template unificado: lê stub_status do Nginx, códigos HTTP gerados pela Intranet e as métricas de negócio (Alunos, Notas, Faturas), suportando roteamento SNI via Proxy Zabbix.'
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$INTRANET.HOST_HEADER}'
          value: '10.10.100.4'
          description: 'Obrigatório para o Proxy saber para qual servidor interno rotear (ex: 10.10.100.4 ou 10.10.101.4)'
        - macro: '{$INTRANET.IP}'
          value: '10.255.255.2'
          description: 'O IP do servidor ou do Proxy/Túnel GRE (onde o Zabbix vai conectar fisicamente).'
        - macro: '{$INTRANET.PORT}'
          value: '80'
          description: 'Porta do servidor (ex: 443 para HTTPS ou 80 para HTTP).'
        - macro: '{$INTRANET.SCHEME}'
          value: 'http'
          description: 'http ou https'
      items:
        - uuid: 6f1c7d2427b54a8e9e1c7f99991206d2
          name: 'Nginx: Obter RAW Stub Status'
          type: HTTP_AGENT
          key: nginx.raw.status
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/basic_status'
          value_type: TEXT
          delay: 30s
          description: 'Coleta bruta do /basic_status do Nginx.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: 1e3a9c4b72f14c2b8c25db9e61234b8c
          name: 'Nginx: Conexões Ativas'
          type: DEPENDENT
          key: nginx.active_connections
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'Active connections:\s+([0-9]+)'
                - \1
        - uuid: 8c25dbda0f0449a6a8b13d6a4c281e09
          name: 'Nginx: Total de Requisições Aceitas'
          type: DEPENDENT
          key: nginx.accepted
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s*\n\s+([0-9]+)'
                - \1
        - uuid: f1a3b5c7d9e142a38b4c5d6e7f8a9b0c
          name: 'Nginx: Total de Requisições Processadas'
          type: DEPENDENT
          key: nginx.requests
          value_type: FLOAT
          master_item:
            key: nginx.raw.status
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s*\n\s+[0-9]+\s+[0-9]+\s+([0-9]+)'
                - \1
                
        - uuid: a1b2c3d4e5f647a89b0c1d2e3f4a5b6c
          name: 'Intranet: Obter RAW Metrics'
          type: HTTP_AGENT
          key: intranet.metrics.raw
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/business/metrics'
          value_type: TEXT
          delay: 30s
          description: 'Coleta as métricas de negócio e códigos HTTP do backend FastAPI.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        
        - uuid: c6b5a4f3e2d140b98a7b6c5d4e3f2a1b
          name: 'Intranet HTTP 200s (Sucesso)'
          type: DEPENDENT
          key: http.2xx
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_2xx'
        - uuid: 1a2b3c4d5e6f47a89b0c1d2e3f4a5b6c
          name: 'Intranet HTTP 300s (Redirecionamentos)'
          type: DEPENDENT
          key: http.3xx
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_3xx'
        - uuid: 6c5b4a3f2e1d40c98b7a6c5d4e3f2a1b
          name: 'Intranet HTTP 400s (Erros de Cliente)'
          type: DEPENDENT
          key: http.4xx
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_4xx'
        - uuid: d4e5f6a7b8c940d1a2b3c4d5e6f7a8b9
          name: 'Intranet HTTP 500s (Erros de Servidor)'
          type: DEPENDENT
          key: http.5xx
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.http_5xx'

        - uuid: e1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6
          name: 'Intranet: Total de Alunos'
          type: DEPENDENT
          key: intranet.metrics.students
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_students'
        - uuid: f2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p7
          name: 'Intranet: Total de Professores'
          type: DEPENDENT
          key: intranet.metrics.professors
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_professors'
        - uuid: g3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8
          name: 'Intranet: Total de Notas Lançadas'
          type: DEPENDENT
          key: intranet.metrics.grades
          value_type: FLOAT
          master_item:
            key: intranet.metrics.raw
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_grades'

        - uuid: h4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9
          name: 'Billing: Obter Métricas Financeiras RAW'
          type: HTTP_AGENT
          key: billing.metrics.get
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/api/billing/metrics'
          value_type: TEXT
          delay: 1m
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: i5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0
          name: 'Billing: Total de Faturas'
          type: DEPENDENT
          key: billing.metrics.invoices
          value_type: FLOAT
          master_item:
            key: billing.metrics.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_invoices'
        - uuid: j6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1
          name: 'Billing: Valor Total Inadimplente'
          type: DEPENDENT
          key: billing.metrics.unpaid
          value_type: FLOAT
          units: 'R$'
          master_item:
            key: billing.metrics.get
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.unpaid_amount'