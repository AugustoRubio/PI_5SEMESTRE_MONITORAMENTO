zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd2af33355590c9666d
      name: 'Templates/Security'
  templates:
    - uuid: 58ca311353804eccbbbdde588e5bde1a
      template: 'Template Security Monitoring - Brute Force'
      name: 'Template Security Monitoring - Brute Force'
      groups:
        - name: 'Templates/Security'
      items:
        - uuid: 255b52152fcb4ca68275cc6a88cdef36
          name: 'Segurança: Total de Falhas de Login'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.1.0'
          key: security.login.failures.total
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Total acumulado de tentativas de login que falharam na Intranet.'
          tags:
            - tag: Application
              value: Security
              
        - uuid: e2a64d380735443db8e6384cad55d025
          name: 'Segurança: Falhas de Login (Última 1h)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.2.0'
          key: security.login.failures.1h
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Quantidade de falhas de login registradas na última hora.'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 6aed27a8de934ab08df5098465515b67
              expression: 'last(/Template Security Monitoring - Brute Force/security.login.failures.1h)>50 and (max(/Template Security Monitoring - Brute Force/security.login.failures.total,5m)>min(/Template Security Monitoring - Brute Force/security.login.failures.total,5m))'
              name: 'Segurança: Alto volume de falhas de login detectado'
              priority: HIGH
              description: 'Mais de 50 falhas em 1h. O alerta desligará automaticamente se o total de falhas estagnar por 5 minutos.'
              
        - uuid: bc49c949a7514a52b4adcc1162988602
          name: 'Segurança: IPs Atacantes Ativos'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.3.0'
          key: security.active.ips
          delay: 30s
          history: 7d
          value_type: UNSIGNED
          description: 'Número de endereços IP únicos que tentaram login recentemente.'
          tags:
            - tag: Application
              value: Security
              
        - uuid: bd44e41c180c4977ba3176d4c31eb2c4
          name: 'Segurança: Status de Simulação de Ataque'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.4.0'
          key: security.attack.status
          delay: 10s
          history: 7d
          value_type: UNSIGNED
          description: 'Indica se uma simulação de Brute Force está sendo executada.'
          valuemap:
            name: 'Attack Status Map'
          tags:
            - tag: Application
              value: Security
          triggers:
            - uuid: 59d364a803264888a6fea7b58a7324fc
              expression: 'last(/Template Security Monitoring - Brute Force/security.attack.status)=1'
              name: 'Segurança: Simulação de Brute Force em execução'
              priority: WARNING
              manual_close: 'YES'
              
        - uuid: 10d364a803264888a6fea7b58a7324aa
          name: 'Segurança: Lista de IPs Atacantes'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.5.0'
          key: security.active.ips.list
          delay: 30s
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Lista em texto dos IPs identificados no ataque atual para uso em Dashboards.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value.trim() === 'Nenhum') {
                      throw new Error('Sem ataque rodando');
                  }
                  // Formata a lista para o Zabbix exibir com quebras de linha reais
                  return value.split(', ').join('\n');
              error_handler: DISCARD_VALUE
          tags:
            - tag: Application
              value: Security
              
        - uuid: a1b2c3d4e5f64777b8c9d0e1f2a3b4c5
          name: 'Segurança: Último Alvo Atacado'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.99999.1.6.0'
          key: security.attack.target
          delay: 30s
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'Página/URL alvo da simulação de Brute Force atual onde os usuários estão sendo bloqueados.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  if (value.trim() === 'Nenhum') {
                      throw new Error('Sem ataque rodando');
                  }
                  return value;
              error_handler: DISCARD_VALUE
          tags:
            - tag: Application
              value: Security
              
      valuemaps:
        - uuid: 9f5e1821c6c3436f814a74acd7655ce5
          name: 'Attack Status Map'
          mappings:
            - value: '0'
              newvalue: Inativo
            - value: '1'
              newvalue: ATACANDO
              