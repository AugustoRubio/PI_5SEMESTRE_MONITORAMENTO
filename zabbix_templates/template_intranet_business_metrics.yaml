zabbix_export:
  version: '7.0'
  templates:
    - uuid: 18f7a63d91b24e1c8d5f309a4b2c1d8e
      template: 'Template Intranet Business Metrics'
      name: 'Template Intranet Business Metrics'
      description: |
        Template para monitoramento de métricas de negócios (BAM - Business Activity Monitoring) da Intranet e da Billing API via HTTP Agent.
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$INTRANET.HOST_HEADER}'
          value: '10.10.100.4'
          description: 'IP interno da Intranet para roteamento de Proxy'
        - macro: '{$INTRANET.IP}'
          value: '10.255.255.2'
          description: 'IP ou Hostname do servidor da Intranet (ou proxy GRE)'
        - macro: '{$INTRANET.SCHEME}'
          value: 'http'
          description: 'Protocolo de conexão (http ou https)'
        - macro: '{$INTRANET.PORT}'
          value: '80'
          description: 'Porta de conexão com a Intranet'
      items:
        - uuid: 2f4a56b78c9d41369b52a14589c67d1f
          name: 'Intranet: Obter Métricas de Negócio'
          type: HTTP_AGENT
          key: intranet.metrics.get
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/business/metrics'
          value_type: TEXT
          delay: 1m
          timeout: 10s
          description: 'Obtém o JSON com as métricas de negócios (Alunos, Professores, Notas) da Intranet.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: 56b7c8d9e0f1425785a2b36c479d10e2
          name: 'Intranet: Total de Alunos'
          type: DEPENDENT
          key: intranet.metrics.students
          value_type: FLOAT
          description: 'Número total de alunos cadastrados no banco de dados.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_students'
          master_item:
            key: intranet.metrics.get
        - uuid: 7d48695b245c48738b52f145c26b479d
          name: 'Intranet: Total de Professores'
          type: DEPENDENT
          key: intranet.metrics.professors
          value_type: FLOAT
          description: 'Número total de professores cadastrados no banco de dados.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_professors'
          master_item:
            key: intranet.metrics.get
        - uuid: 15f4836b759a410b96b4125d84c62f1a
          name: 'Intranet: Total de Notas Lançadas'
          type: DEPENDENT
          key: intranet.metrics.grades
          value_type: FLOAT
          description: 'Volume total de notas lançadas pelos professores no sistema.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_grades'
          master_item:
            key: intranet.metrics.get
            
        - uuid: 6c4d7b5a8e234057861b5894f26b541d
          name: 'Billing: Obter Métricas Financeiras'
          type: HTTP_AGENT
          key: billing.metrics.get
          url: '{$INTRANET.SCHEME}://{$INTRANET.IP}:{$INTRANET.PORT}/api/billing/metrics'
          value_type: TEXT
          delay: 1m
          timeout: 10s
          description: 'Obtém o JSON com as métricas financeiras do microsserviço de pagamentos.'
          headers:
            - name: 'Host'
              value: '{$INTRANET.HOST_HEADER}'
        - uuid: 3b41d5f67a984025a1b465728d9c104e
          name: 'Billing: Total de Faturas'
          type: DEPENDENT
          key: billing.metrics.invoices
          value_type: FLOAT
          description: 'Número total de faturas geradas pelo sistema.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_invoices'
          master_item:
            key: billing.metrics.get
        - uuid: 9d86b976db5a4d3393b482f767858d4a
          name: 'Billing: Valor Total Inadimplente'
          type: DEPENDENT
          key: billing.metrics.unpaid
          value_type: FLOAT
          units: 'R$'
          description: 'Soma total em Reais (R$) de todas as faturas que constam como PENDING.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.unpaid_amount'
          master_item:
            key: billing.metrics.get