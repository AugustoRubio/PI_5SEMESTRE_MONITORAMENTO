zabbix_export:
  version: '7.0'
  templates:
    - uuid: d41d8cd98f004204a9800998ecf8427e
      template: 'Template Intranet Business Metrics'
      name: 'Template Intranet Business Metrics'
      description: |
        Template para monitoramento de métricas de negócios (BAM - Business Activity Monitoring) da Intranet e da Billing API via HTTP Agent.
      groups:
        - name: Templates/Applications
      macros:
        - macro: '{$INTRANET.SCHEME}'
          value: 'https'
          description: 'Protocolo de conexão (http ou https)'
        - macro: '{$INTRANET.PORT}'
          value: '443'
          description: 'Porta de conexão com a Intranet'
      items:
        - uuid: 3e25960a79eb4fe2b2c8a221f7edbe47
          name: 'Intranet: Obter Métricas de Negócio'
          type: HTTP_AGENT
          key: intranet.metrics.get
          url: '{$INTRANET.SCHEME}://{HOST.CONN}:{$INTRANET.PORT}/business/metrics'
          value_type: TEXT
          delay: 1m
          description: 'Obtém o JSON com as métricas de negócios (Alunos, Professores, Notas) da Intranet.'
        - uuid: 8f14e45fceea4b209d73dcb5a6d59b36
          name: 'Intranet: Total de Alunos'
          type: DEPENDENT
          key: intranet.metrics.students
          value_type: FLOAT
          description: 'Número total de alunos cadastrados no banco de dados.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_students'
          master_item:
            key: intranet.metrics.get
        - uuid: c29f60bc9fb54d76b17a15998a4d46c8
          name: 'Intranet: Total de Professores'
          type: DEPENDENT
          key: intranet.metrics.professors
          value_type: FLOAT
          description: 'Número total de professores cadastrados no banco de dados.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_professors'
          master_item:
            key: intranet.metrics.get
        - uuid: 4f92bc44ebc441cf8fc1e0deeb10dfc9
          name: 'Intranet: Total de Notas Lançadas'
          type: DEPENDENT
          key: intranet.metrics.grades
          value_type: FLOAT
          description: 'Volume total de notas lançadas pelos professores no sistema.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_grades'
          master_item:
            key: intranet.metrics.get
            
        - uuid: a37b425ef5f54924b22c71095d31215b
          name: 'Billing: Obter Métricas Financeiras'
          type: HTTP_AGENT
          key: billing.metrics.get
          url: '{$INTRANET.SCHEME}://{HOST.CONN}:{$INTRANET.PORT}/api/billing/metrics'
          value_type: TEXT
          delay: 1m
          description: 'Obtém o JSON com as métricas financeiras do microsserviço de pagamentos.'
        - uuid: d14210cfef4f45209baecb0ba0882e3c
          name: 'Billing: Total de Faturas'
          type: DEPENDENT
          key: billing.metrics.invoices
          value_type: FLOAT
          description: 'Número total de faturas geradas pelo sistema.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.total_invoices'
          master_item:
            key: billing.metrics.get
        - uuid: b46781284d7249a58bb0e02660d5b599
          name: 'Billing: Valor Total Inadimplente'
          type: DEPENDENT
          key: billing.metrics.unpaid
          value_type: FLOAT
          units: 'R$'
          description: 'Soma total em Reais (R$) de todas as faturas que constam como PENDING.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.unpaid_amount'
          master_item:
            key: billing.metrics.get