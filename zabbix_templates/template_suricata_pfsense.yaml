zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a1b2c3d4e5f647a88b0c1d2e3f4a5b6c
      name: Templates/pfSense
  templates:
    - uuid: b1c2d3e4f5a647b88c0d1e2f3a4b5c6d
      template: 'Template pfSense Suricata EVE Alerts LLD'
      name: 'Template pfSense Suricata EVE Alerts LLD'
      description: 'Monitoramento dinâmico via LLD com motor de Log ativo e Macros de Expressão precisas.'
      groups:
        - name: Templates/pfSense
      discovery_rules:
        - uuid: c1d2e3f4a5b647c88d0e1f2a3b4c5d6e
          name: 'Suricata: Descoberta de Interfaces'
          type: ZABBIX_ACTIVE
          key: 'vfs.dir.get[/var/log/suricata/]'
          delay: '5m'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#TYPE}'
                value: '^dir$'
                formulaid: A
              - macro: '{#DIRNAME}'
                value: '^suricata_.*'
                formulaid: B
          lld_macro_paths:
            - lld_macro: '{#DIRNAME}'
              path: '$.basename'
            - lld_macro: '{#TYPE}'
              path: '$.type'
          item_prototypes:
            - uuid: d1e2f3a4b5c647d88e0f1a2b3c4d5e6f
              name: 'Suricata ({#DIRNAME}): EVE Log (Master)'
              type: ZABBIX_ACTIVE
              key: 'log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]'
              delay: '1s'
              history: 7d
              trends: '0'
              value_type: LOG
              preprocessing:
                - type: REGEX
                  parameters:
                    - '.*"event_type":\s*"alert".*'
                    - '\0'
                  error_handler: DISCARD_VALUE
            - uuid: e1f2a3b4c5d647e88f0a1b2c3d4e5f6a
              name: 'Suricata ({#DIRNAME}): IP de Origem'
              type: DEPENDENT
              key: 'suricata.eve.src_ip[{#DIRNAME}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.src_ip'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]'
            - uuid: f1a2b3c4d5e647f88a0b1c2d3e4f5a6b
              name: 'Suricata ({#DIRNAME}): IP de Destino'
              type: DEPENDENT
              key: 'suricata.eve.dest_ip[{#DIRNAME}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.dest_ip'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]'
            - uuid: a2b3c4d5e6f748a88b1c2d3e4f5a6b7c
              name: 'Suricata ({#DIRNAME}): Assinatura do Alerta'
              type: DEPENDENT
              key: 'suricata.eve.signature[{#DIRNAME}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.alert.signature'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]'
            - uuid: b2c3d4e5f6a748b88c1d2e3f4a5b6c7d
              name: 'Suricata ({#DIRNAME}): Severidade'
              type: DEPENDENT
              key: 'suricata.eve.severity[{#DIRNAME}]'
              delay: '0'
              history: 30d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.alert.severity'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]'
          trigger_prototypes:
            # ================= TRIGGER 1: AMEAÇAS GRAVES =================
            - uuid: c2d3e4f5a6b748c88d1e2f3a4b5c6d7e
              expression: 'length(last(/Template pfSense Suricata EVE Alerts LLD/log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]))>0 and last(/Template pfSense Suricata EVE Alerts LLD/suricata.eve.severity[{#DIRNAME}])="1"'
              name: 'Suricata ({#DIRNAME}) [CRÍTICO]: Ameaça Grave Detectada'
              event_name: 'Suricata ({#DIRNAME}) CRÍTICO: {?last(//suricata.eve.signature[{#DIRNAME}])} (Origem: {?last(//suricata.eve.src_ip[{#DIRNAME}])} -> Destino: {?last(//suricata.eve.dest_ip[{#DIRNAME}])})'
              priority: HIGH
              description: 'O Suricata classificou esta assinatura com Severidade 1.'
              manual_close: 'YES'
              type: MULTIPLE
              tags:
                - tag: Origem
                  value: '{?last(//suricata.eve.src_ip[{#DIRNAME}])}'
                - tag: Destino
                  value: '{?last(//suricata.eve.dest_ip[{#DIRNAME}])}'
                - tag: Assinatura
                  value: '{?last(//suricata.eve.signature[{#DIRNAME}])}'
                - tag: Severidade
                  value: '1'
                  
            # ================= TRIGGER 2: AVISOS COMUNS =================
            - uuid: d2e3f4a5b6c748d88e1f2a3b4c5d6e7f
              expression: 'length(last(/Template pfSense Suricata EVE Alerts LLD/log["/var/log/suricata/{#DIRNAME}/eve.json",,"UTF-8",100,"skip"]))>0 and last(/Template pfSense Suricata EVE Alerts LLD/suricata.eve.severity[{#DIRNAME}])<>"1"'
              name: 'Suricata ({#DIRNAME}): Aviso de Rede Registrado'
              event_name: 'Suricata ({#DIRNAME}) AVISO: {?last(//suricata.eve.signature[{#DIRNAME}])} (Origem: {?last(//suricata.eve.src_ip[{#DIRNAME}])} -> Destino: {?last(//suricata.eve.dest_ip[{#DIRNAME}])})'
              priority: NOT_CLASSIFIED
              description: 'O Suricata registrou um evento de severidade 2 ou 3.'
              manual_close: 'YES'
              type: MULTIPLE
              tags:
                - tag: Origem
                  value: '{?last(//suricata.eve.src_ip[{#DIRNAME}])}'
                - tag: Destino
                  value: '{?last(//suricata.eve.dest_ip[{#DIRNAME}])}'
                - tag: Assinatura
                  value: '{?last(//suricata.eve.signature[{#DIRNAME}])}'
                - tag: Severidade
                  value: '{?last(//suricata.eve.severity[{#DIRNAME}])}'